version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /frontend/apps/portal
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /frontend/apps/admin
    schedule:
      interval: weekly
      day: monday
