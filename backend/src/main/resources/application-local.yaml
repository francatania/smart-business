smart-business:
  environment: local
  public-base-url: ${SMART_BUSINESS_PUBLIC_BASE_URL:http://localhost:5173}
  identity:
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/smart-business}
      authorization-uri: ${OIDC_AUTHORIZATION_URI:http://localhost:8081/realms/smart-business/protocol/openid-connect/auth}
      token-uri: ${OIDC_TOKEN_URI:http://localhost:8081/realms/smart-business/protocol/openid-connect/token}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/smart-business/protocol/openid-connect/certs}
      end-session-uri: ${OIDC_END_SESSION_URI:http://localhost:8081/realms/smart-business/protocol/openid-connect/logout}
      portal-client-secret: ${PORTAL_BFF_CLIENT_SECRET:local-portal-bff-secret}
      portal-callback-uri: ${PORTAL_BFF_CALLBACK_URI:http://portal.localhost:5173/api/auth/callback/portal-bff}
      portal-post-logout-uri: ${PORTAL_BFF_POST_LOGOUT_URI:http://portal.localhost:5173/}
      admin-client-secret: ${ADMIN_BFF_CLIENT_SECRET:local-admin-bff-secret}
      admin-callback-uri: ${ADMIN_BFF_CALLBACK_URI:http://admin.localhost:5174/api/auth/callback/admin-bff}
      admin-post-logout-uri: ${ADMIN_BFF_POST_LOGOUT_URI:http://admin.localhost:5174/}

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_business?currentSchema=smart_business}
    username: ${DATABASE_USERNAME:smart_business_app}
    password: ${DATABASE_PASSWORD:local-smart-business-app}

server:
  servlet:
    session:
      cookie:
        name: SBSESSION
        path: /
        http-only: true
        same-site: lax
        secure: false
