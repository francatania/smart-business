name: smart-business

services:
  admin:
    profiles: ['applications']
    build:
      context: ..
      dockerfile: frontend/apps/admin/Dockerfile
      args:
        VITE_PUBLIC_KEYCLOAK_ACCOUNT_URL: ${KEYCLOAK_PUBLIC_URL}/realms/smart-business/account/
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${ADMIN_PORT}:80'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - platform

  portal:
    profiles: ['applications']
    build:
      context: ..
      dockerfile: frontend/apps/portal/Dockerfile
      args:
        VITE_PUBLIC_KEYCLOAK_ACCOUNT_URL: ${KEYCLOAK_PUBLIC_URL}/realms/smart-business/account/
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PORTAL_PORT}:80'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - platform

  backend:
    profiles: ['backend', 'applications']
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${APP_DATABASE}?currentSchema=smart_business
      DATABASE_USERNAME: ${APP_DATABASE_USER}
      DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
      SERVER_PORT: '8080'
      MANAGEMENT_SERVER_PORT: '8082'
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_AUTHORIZATION_URI: ${OIDC_AUTHORIZATION_URI}
      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI}
      OIDC_END_SESSION_URI: ${OIDC_END_SESSION_URI:-http://localhost:${KEYCLOAK_PORT}/realms/smart-business/protocol/openid-connect/logout}
      PORTAL_BFF_CLIENT_SECRET: ${PORTAL_BFF_CLIENT_SECRET}
      PORTAL_BFF_CALLBACK_URI: ${PORTAL_BFF_CALLBACK_URI}
      PORTAL_BFF_POST_LOGOUT_URI: ${PORTAL_BFF_POST_LOGOUT_URI}
      ADMIN_BFF_CLIENT_SECRET: ${ADMIN_BFF_CLIENT_SECRET}
      ADMIN_BFF_CALLBACK_URI: ${ADMIN_BFF_CALLBACK_URI}
      ADMIN_BFF_POST_LOGOUT_URI: ${ADMIN_BFF_POST_LOGOUT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${BACKEND_PORT}:8080'
      - '127.0.0.1:${BACKEND_MANAGEMENT_PORT}:8082'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/8082; printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - platform

  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_ADMIN_DATABASE}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      APP_DATABASE: ${APP_DATABASE}
      APP_DATABASE_USER: ${APP_DATABASE_USER}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
      KEYCLOAK_DATABASE: ${KEYCLOAK_DATABASE}
      KEYCLOAK_DATABASE_USER: ${KEYCLOAK_DATABASE_USER}
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username=${POSTGRES_ADMIN_USER} --dbname=${POSTGRES_ADMIN_DATABASE}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - platform

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: ['start-dev']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DATABASE}
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_PORT: ${KEYCLOAK_PORT}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT}:${KEYCLOAK_PORT}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      platform:
        aliases:
          - ${KEYCLOAK_NETWORK_ALIAS}

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: 'no'
    entrypoint: ['/bin/bash', '/config/reconcile-realm.sh']
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:${KEYCLOAK_PORT}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_CONFIGURATION_PROFILE: ${KEYCLOAK_CONFIGURATION_PROFILE}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      PORTAL_BFF_CLIENT_SECRET: ${PORTAL_BFF_CLIENT_SECRET}
      PORTAL_BFF_ORIGIN: ${PORTAL_BFF_ORIGIN}
      PORTAL_BFF_CALLBACK_URI: ${PORTAL_BFF_CALLBACK_URI}
      PORTAL_BFF_POST_LOGOUT_URI: ${PORTAL_BFF_POST_LOGOUT_URI}
      ADMIN_BFF_CLIENT_SECRET: ${ADMIN_BFF_CLIENT_SECRET}
      ADMIN_BFF_ORIGIN: ${ADMIN_BFF_ORIGIN}
      ADMIN_BFF_CALLBACK_URI: ${ADMIN_BFF_CALLBACK_URI}
      ADMIN_BFF_POST_LOGOUT_URI: ${ADMIN_BFF_POST_LOGOUT_URI}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/reconcile-realm.sh:/config/reconcile-realm.sh:ro
    networks:
      - platform

  keycloak-test-users:
    profiles: ['identity-test']
    image: quay.io/keycloak/keycloak:26.7.0
    restart: 'no'
    entrypoint: ['/bin/bash', '/config/provision-test-users.sh']
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:${KEYCLOAK_PORT}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_CONFIGURATION_PROFILE: ${KEYCLOAK_CONFIGURATION_PROFILE}
      KEYCLOAK_TEST_CUSTOMER_USERNAME: ${KEYCLOAK_TEST_CUSTOMER_USERNAME:-}
      KEYCLOAK_TEST_CUSTOMER_PASSWORD: ${KEYCLOAK_TEST_CUSTOMER_PASSWORD:-}
      KEYCLOAK_TEST_ADMIN_USERNAME: ${KEYCLOAK_TEST_ADMIN_USERNAME:-}
      KEYCLOAK_TEST_ADMIN_PASSWORD: ${KEYCLOAK_TEST_ADMIN_PASSWORD:-}
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
    volumes:
      - ./keycloak/provision-test-users.sh:/config/provision-test-users.sh:ro
    networks:
      - platform

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET}
    ports:
      - '127.0.0.1:${GARAGE_S3_PORT}:3900'
      - '127.0.0.1:${GARAGE_ADMIN_PORT}:3903'
    volumes:
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - platform

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '5000'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - platform

networks:
  platform:
    name: ${PLATFORM_NETWORK_NAME}

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME}
  garage-metadata:
    name: smart-business-garage-metadata
  garage-data:
    name: smart-business-garage-data
  mailpit-data:
    name: smart-business-mailpit-data
