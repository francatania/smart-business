name: smart-business

services:
  portal:
    profiles: ['applications']
    build:
      context: ..
      dockerfile: frontend/apps/portal/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PORTAL_PORT}:80'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - platform

  backend:
    profiles: ['backend', 'applications']
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${APP_DATABASE}?currentSchema=smart_business
      DATABASE_USERNAME: ${APP_DATABASE_USER}
      DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
      SERVER_PORT: '8080'
      MANAGEMENT_SERVER_PORT: '8082'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BACKEND_PORT}:8080'
      - '127.0.0.1:${BACKEND_MANAGEMENT_PORT}:8082'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/8082; printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - platform

  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_ADMIN_DATABASE}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      APP_DATABASE: ${APP_DATABASE}
      APP_DATABASE_USER: ${APP_DATABASE_USER}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
      KEYCLOAK_DATABASE: ${KEYCLOAK_DATABASE}
      KEYCLOAK_DATABASE_USER: ${KEYCLOAK_DATABASE_USER}
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username=${POSTGRES_ADMIN_USER} --dbname=${POSTGRES_ADMIN_DATABASE}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - platform

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DATABASE}
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PORTAL_BFF_CLIENT_SECRET: ${PORTAL_BFF_CLIENT_SECRET}
      ADMIN_BFF_CLIENT_SECRET: ${ADMIN_BFF_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT}:8080'
    volumes:
      - ./keycloak/realm-smart-business.json:/opt/keycloak/data/import/realm-smart-business.json:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - platform

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET}
    ports:
      - '127.0.0.1:${GARAGE_S3_PORT}:3900'
      - '127.0.0.1:${GARAGE_ADMIN_PORT}:3903'
    volumes:
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - platform

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '5000'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - platform

networks:
  platform:
    name: smart-business-platform

volumes:
  postgres-data:
    name: smart-business-postgres-data
  garage-metadata:
    name: smart-business-garage-metadata
  garage-data:
    name: smart-business-garage-data
  mailpit-data:
    name: smart-business-mailpit-data
